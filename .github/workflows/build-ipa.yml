name: build-ipa

# 在 macOS runner 上构建未签名 ipa —— 不需要你有一台 Mac
# 产物:WMFree.ipa(未签名),Windows 上用 Sideloadly + 自己的 Apple ID 签名安装
on:
  push:
    branches: [ main, master ]
    paths: [ 'ios/**' ]
  workflow_dispatch:

jobs:
  build:
    # macos-14 对新账号有调度限制,依次尝试 macos-latest(当前为 macOS 15/ARM)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate

      - name: Build unsigned app
        run: |
          cd ios
          xcodebuild -project WMFree.xcodeproj -scheme WMFree \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build | tail -20

      - name: Package ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WMFree.app Payload/
          zip -r WMFree.ipa Payload
          ls -la WMFree.ipa

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: WMFree-ipa
          path: ios/WMFree.ipa
